[pytest]
addopts = --import-mode=importlib
# Explicitly setting norecursedirs replaces pytest's built-in default list
# (which excludes dot-directories, build/, dist/, node_modules/, venv/, etc.)
# rather than appending to it -- so those defaults are repeated here
# alongside the project-specific exclusions (demo-repo has its own
# self-contained pytest config and is meant to be run standalone via
# `cd demo-repo && python -m pytest`; .terraform and mutants are generated
# artifact directories).
norecursedirs = .* demo-repo .terraform mutants build dist node_modules venv {arch} *.egg CVS _darcs
